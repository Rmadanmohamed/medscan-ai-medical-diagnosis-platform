name: Medical prototype quality
on:
  pull_request:
  push:
    branches: ['audit/final-medscan-safety']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q app.py ai_medscan_app.py disease_prediction.py retinal_analyzer.py medical_image_analyzer.py
      - run: python -m unittest discover -s tests -v
      - run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app.py").run()
          assert not app.exception, app.exception
          PY
